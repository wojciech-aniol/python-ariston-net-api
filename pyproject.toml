[build-system]
build-backend = "flit_core.buildapi"
requires = ["flit_core >=3.2,<4"]

[project]
name = "ariston-net-api"
readme = "README.md"
authors = [
    { name = "Tamás Füstös", email = "fustom@gmail.com" }
]
maintainers = [
    { name = "Wojciech Anioł" }
]
dependencies = [
    "aiohttp",
    "requests"
]
requires-python = ">=3.13"
license = { file = "LICENSE" }
version = "0.20.5"
dynamic = ['description']

[project.urls]
Repository = "https://github.com/wojciech-aniol/python-ariston-net-api.git"
Issues = "https://github.com/wojciech-aniol/python-ariston-net-api/issues"

[project.optional-dependencies]
test = [
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.2",
]

[tool.ruff]
target-version = "py313"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
