name: Tests

on:
  # auto-release.yml runs these tests for main.
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install ruff
        run: pip install "$(grep -o 'ruff==[0-9.]*' pyproject.toml)"
      - name: Lint
        run: ruff check --output-format=github .
      - name: Check format
        run: ruff format --check .

  pytest:
    runs-on: "ubuntu-latest"
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the package
        run: pip install -e ".[test]"
      - name: Run tests
        run: pytest -q
